{% extends 'management/base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="box" style="max-width: 400px; margin: 0 auto;">
    <h2>Вход в учебный центр</h2>

    {% if form.errors %}
    <p style="color: #e74c3c;">Неверный логин или пароль. Попробуйте снова.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Войти</button>
    </form>
</div>
{% endblock %}
