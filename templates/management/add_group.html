{% extends 'management/base.html' %}
{% block title %}Добавить группу{% endblock %}
{% block content %}
<div class="box" style="max-width: 500px; margin: 0 auto;">
    <a href="{% url 'home' %}" class="back-link">← На главную</a>
    <h2>📖 Создать учебную группу</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Создать группу</button>
    </form>
</div>
{% endblock %}
